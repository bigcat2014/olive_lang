name: CMake Matrix Build

on:
  # schedule:
  #   # Run nightly at 8 AM UTC
  #   - cron: '0 8 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-linux:
    runs-on: ubuntu-latest

    # Use custom container images
    container:
      image: ghcr.io/${{ github.repository }}/linux-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    strategy:
      # TODO(lthomas): Consider changing this to true when your workflow is stable.
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        c_compiler: [gcc, clang]
        # compiler_version: [13, 14, 15, 19, 20, 21]
        compiler_version: [13, 14, 19, 20, 21]
        include:
          - compiler: gcc
            preset_prefix: linux-gcc
          - compiler: clang
            preset_prefix: linux-clang
          - build_type: Debug
            build_type_lower: debug
          - build_type: Release
            build_type_lower: release
        exclude:
          # GCC only has versions 13, 14, 15
          - compiler: gcc
            compiler_version: 19
          - compiler: gcc
            compiler_version: 20
          - compiler: gcc
            compiler_version: 21
          # Clang only has versions 19, 20, 21
          - compiler: clang
            compiler_version: 13
          - compiler: clang
            compiler_version: 14
          # - compiler: clang
          #   compiler_version: 15

    steps:
    - uses: actions/checkout@v4

    # Set compiler version via environment variables
    - name: Set Compiler
      run: |
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          update-alternatives --set gcc /usr/bin/gcc-${{ matrix.compiler_version }}
          update-alternatives --set g++ /usr/bin/g++-${{ matrix.compiler_version }}
        else
          update-alternatives --set clang /usr/bin/clang-${{ matrix.compiler_version }}
          update-alternatives --set clang++ /usr/bin/clang++-${{ matrix.compiler_version }}
          update-alternatives --set clang-tidy /usr/bin/clang-tidy-${{ matrix.compiler_version }}
          update-alternatives --set run-clang-tidy /usr/bin/run-clang-tidy-${{ matrix.compiler_version }}
          update-alternatives --set clang-format /usr/bin/clang-format-${{ matrix.compiler_version }}
          update-alternatives --set llvm-cov /usr/lib/llvm-${{ matrix.compiler_version }}/bin/llvm-cov
        fi

    - name: Configure
      run: cmake --preset ${{ matrix.preset_prefix }}-${{ matrix.build_type_lower }}
    
    - name: Build
      run: cmake --build --preset ${{ matrix.preset_prefix }}-${{ matrix.build_type_lower }} --target all
    
    - name: Test
      if: matrix.build_type == 'Debug'
      run: cmake --build --preset ${{ matrix.preset_prefix }}-${{ matrix.build_type_lower }} --target run_tests

  build-windows:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2019, windows-2022]
        build_type: [Debug, Release]
        include:
          - build_type: Debug
            build_type_lower: debug
          - build_type: Release
            build_type_lower: release
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@master
    
    - name: Install Windows Dependencies
      run: |
        choco install -y `
          llvm `
          doxygen `
          miktex
        pip install run-clang-format cmakelang gcovr
    
    - name: Configure
      run: cmake --preset windows-${{ matrix.build_type_lower }}
    
    - name: Build
      run: cmake --build --preset windows-${{ matrix.build_type_lower }} --target all
    
  #   - name: Test
  #     if: matrix.build_type == 'Debug'
  #     run: cmake --build --preset windows-${{ matrix.build_type_lower }} --target run_tests